name: Tell Bing about changed pages (IndexNow)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to send"
        type: choice
        options: [405rubbermulch, discountokc]
        default: 405rubbermulch
      urls:
        description: "discountokc.com pages to send, space separated (blank sends every page)"
        required: false
        default: ""

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for Hostinger to put the push live
        if: github.event_name == 'push'
        run: sleep 120
      - name: Send changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SITE: ${{ inputs.site }}
          URLS: ${{ inputs.urls }}
        run: |
          if [ "$SITE" = "discountokc" ]; then
            python3 tools/indexnow_ping.py --discountokc $URLS
          elif [ "$EVENT" != "push" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 tools/indexnow_ping.py --all
          else
            python3 tools/indexnow_ping.py $(git diff --name-only "$BEFORE" "$AFTER")
          fi
